name: Sync Upstream

on:
  schedule:
    # 每小时整点自动同步
    - cron: "0 * * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # Checkout 当前 Fork
      #
      # 40 天 heartbeat 需要本地 Git 环境，
      # 使用 shallow clone 即可。
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ==========================================================
      # 同步 master
      #
      # 如果原作者仍然存在 master：
      #     upstream master → 你的 master
      #
      # 如果原作者删除 master：
      #     跳过，不导致整个 Workflow 失败。
      # ==========================================================
      - name: Sync master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Check upstream master branch ==="

          if gh api \
            "/repos/blackmatrix7/ios_rule_script/branches/master" \
            >/dev/null 2>&1; then

            echo "=== Sync master ==="

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
              -F branch="master"

          else
            echo "Upstream master branch does not exist."
            echo "Skipping master sync."
          fi

      # ==========================================================
      # 同步 release
      #
      # 如果原作者仍然存在 release：
      #     upstream release → 你的 release
      #
      # 如果原作者删除 release：
      #     跳过，不导致整个 Workflow 失败。
      # ==========================================================
      - name: Sync release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Check upstream release branch ==="

          if gh api \
            "/repos/blackmatrix7/ios_rule_script/branches/release" \
            >/dev/null 2>&1; then

            echo "=== Sync release ==="

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
              -F branch="release"

          else
            echo "Upstream release branch does not exist."
            echo "Skipping release sync."
          fi

      # ==========================================================
      # 40 天维护仓库活动
      #
      # heartbeat 文件：
      # .github/sync-heartbeat
      #
      # 每 40 天更新一次。
      # ==========================================================
      - name: Keep repository active
        shell: bash
        run: |
          set -e

          echo "=== Check 40-day repository activity ==="

          HEARTBEAT_FILE=".github/sync-heartbeat"

          # 获取最新 master
          git fetch origin master
          git checkout -B master origin/master

          mkdir -p .github

          # --------------------------------------------------------
          # 读取上一次 heartbeat 时间
          # --------------------------------------------------------
          if [ -f "$HEARTBEAT_FILE" ]; then
            LAST_HEARTBEAT=$(cat "$HEARTBEAT_FILE")

            LAST_HEARTBEAT_TS=$(
              date -d "$LAST_HEARTBEAT" +%s 2>/dev/null || echo 0
            )
          else
            LAST_HEARTBEAT_TS=0
          fi

          NOW_TS=$(date +%s)

          # --------------------------------------------------------
          # 计算距离上一次 heartbeat 的天数
          # --------------------------------------------------------
          if [ "$LAST_HEARTBEAT_TS" -eq 0 ]; then
            DAYS=999
          else
            DAYS=$(( (NOW_TS - LAST_HEARTBEAT_TS) / 86400 ))
          fi

          echo "Days since last heartbeat: ${DAYS}"

          # --------------------------------------------------------
          # 达到 40 天则创建 heartbeat commit
          # --------------------------------------------------------
          if [ "$DAYS" -ge 40 ]; then

            NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            echo "Creating heartbeat: ${NOW_UTC}"

            printf '%s\n' "$NOW_UTC" > "$HEARTBEAT_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$HEARTBEAT_FILE"

            git commit \
              -m "chore: keep repository active"

            git push origin master

            echo "=== Heartbeat commit completed ==="

          else
            echo "No heartbeat required."
          fi

      # ==========================================================
      # 最终检查
      # ==========================================================
      - name: Verify
        shell: bash
        run: |
          echo "=== Verify ==="

          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse HEAD

          echo ""
          echo "=== Sync completed successfully ==="
