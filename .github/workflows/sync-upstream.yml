name: Sync Upstream

on:
  schedule:
    # 每小时整点自动同步
    - cron: "0 * * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Sync master ==="
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -F branch="master"

      - name: Sync release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Sync release ==="
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -F branch="release"

      # ==========================================================
      # 40 天维护仓库活动
      #
      # heartbeat 文件：
      # .github/sync-heartbeat
      #
      # 每 40 天更新一次。
      # 该文件不放在 .github/workflows/，
      # 避免触发 workflows permission 限制。
      # ==========================================================
      - name: Keep repository active
        shell: bash
        run: |
          set -e

          echo "=== Check 40-day repository activity ==="

          HEARTBEAT_FILE=".github/sync-heartbeat"

          # 获取最新的 main
          git fetch origin main

          git checkout -B main origin/main

          mkdir -p .github

          if [ -f "$HEARTBEAT_FILE" ]; then
            LAST_HEARTBEAT=$(cat "$HEARTBEAT_FILE")

            LAST_HEARTBEAT_TS=$(
              date -d "$LAST_HEARTBEAT" +%s 2>/dev/null || echo 0
            )
          else
            LAST_HEARTBEAT_TS=0
          fi

          NOW_TS=$(date +%s)

          if [ "$LAST_HEARTBEAT_TS" -eq 0 ]; then
            DAYS=999
          else
            DAYS=$(( (NOW_TS - LAST_HEARTBEAT_TS) / 86400 ))
          fi

          echo "Days since last heartbeat: ${DAYS}"

          if [ "$DAYS" -ge 40 ]; then
            NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            echo "Creating heartbeat: ${NOW_UTC}"

            printf '%s\n' "$NOW_UTC" > "$HEARTBEAT_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$HEARTBEAT_FILE"

            git commit \
              -m "chore: keep repository active"

            git push origin main

            echo "=== Heartbeat commit completed ==="
          else
            echo "No heartbeat required."
          fi
